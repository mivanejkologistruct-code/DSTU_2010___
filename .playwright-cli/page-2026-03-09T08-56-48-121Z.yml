            - subscript [ref=e1091]: Ed
            - text: ". The appropriate strain profile is obtained by the method of bisection until the required convergence is achieved. The solution method proceeds as follows:"
          - list [ref=e1092]:
            - listitem [ref=e1093]: The axial force at the ends of each strain range are evaluated and the correct strain range is identified.
            - listitem [ref=e1094]: The variation of the strain profile is considered by considering the variable strain at a suitable depth of the cross-section as a single unknown variable.
            - listitem [ref=e1095]: Three values of the variable strain are considered at start, center, and end of the examined strain range, separating the examined stress range in two halves.
            - listitem [ref=e1096]: The axial force is estimated from the strain profile that corresponds to the three values of the variable strain.
            - listitem [ref=e1097]: The target axial force is compared with the estimated axial force at the start, center and end of the examined strain range. The correct half of the examined strain range is identified.
            - listitem [ref=e1098]: The examined strain range is set to the correct half and the algorithm is repeated from step 3 until the difference between the determined axial force and the target axial force is smaller than the desired tolerance.
          - paragraph
          - heading "Calculation of M - N interaction diagram" [level=3] [ref=e1099]
          - paragraph [ref=e1100]: The interaction diagram between bending moment M and axial force N (M - N interaction) is calculated by examining all the permitted strain distributions with sufficient discretization in each strain range. For each strain range the variation of the strain profile is considered by considering the variable strain at a suitable depth of the cross-section. The number of the considered intermediate strain profiles is 20 for strain ranges 1, 3 and 100 for strain range 2.
          - heading "Calculation of required reinforcement for given for given bending moment MEd and axial force NEd" [level=3] [ref=e1101]:
            - text: Calculation of required reinforcement for given for given bending moment M
            - subscript [ref=e1102]: Ed
            - text: and axial force N
            - subscript [ref=e1103]: Ed
