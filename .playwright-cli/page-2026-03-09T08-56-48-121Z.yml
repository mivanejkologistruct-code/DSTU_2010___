            - text: at least equal to the bending moment M
            - subscript [ref=e1107]: Ed
            - text: for given and axial force N
            - subscript [ref=e1108]: Ed
            - text: . A common factor is calculated that multiplies the reinforcement areas of the selected reinforcement layers. The rest of the reinforcement layers are not affected. The value of the multiplication factor is obtained by a root finding algorithm based on the ITP method so that the bending moment resistance M
            - subscript [ref=e1109]: Rd
            - text: becomes equal to the specified bending moment M
            - subscript [ref=e1110]: Ed
            - text: for given and axial force N
            - subscript [ref=e1111]: Ed
            - text: .
          - paragraph [ref=e1112]: It is noted that when two or more layers are modified to obtain the required reinforcement the resulting reinforcement distribution may not be the optimal (i.e. corresponding to the least amount of reinforcement). This is because the variable reinforcement layers are all multiplied by a common factor.
